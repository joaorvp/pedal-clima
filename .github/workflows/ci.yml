name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testes unitários
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /pedal-clima/
      - name: Teste de ponta a ponta (build de produção)
        timeout-minutes: 10
        run: |
          # usa o Chrome que já vem na máquina do GitHub: sem baixar navegador nem depender do apt do Ubuntu.
          # Se ele faltar ou não funcionar com esta versão do Playwright, baixa o Chromium e roda de novo.
          if command -v google-chrome >/dev/null; then
            PW_CHROMIUM="$(command -v google-chrome)" npm run test:e2e && exit 0
            echo "::warning::Chrome do sistema falhou; tentando com o Chromium do Playwright"
          fi
          npx playwright install chromium
          npm run test:e2e
